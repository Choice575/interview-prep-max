name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Every .js file, not a hand-maintained list: 14 of 24 files (including
      # every module added recently) were previously never syntax-checked.
      - name: Syntax check
        run: |
          for file in $(git ls-files '*.js'); do
            node --check "$file" || exit 1
          done
      - name: Lint
        run: npm run lint:strict
      - name: Unit and integration tests
        run: npm test
      - name: JSON validation
        run: node validate.js
      - name: Question quality baseline
        run: npm run quality:questions
      - name: Release integrity check
        run: node verify-release.js
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser tests
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
